version: 2

models:
  - name: int_indicators_long
    description: >
      All six OECD sources unioned into one long table: one row per region,
      indicator, year and source. Full history retained; no analysis filters
      applied. This is the queryable base for coverage checks and the input to
      the analysis marts.
    columns:
      - name: reg_id
        tests: [not_null]
      - name: indicator
        tests: [not_null]
      - name: year
        tests: [not_null]
      - name: value
        tests: [not_null]
      - name: source
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [reg_id, indicator, year, source]